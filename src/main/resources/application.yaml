spring:
  application:
    name: agora
  profiles:
    active: local

---

spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  datasource:
    url: jdbc:h2:mem:agora_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  flyway:
    enabled: false

jwt:
  secret-key: localEnvDummySecretKeyForAgoraProjectTest12345!
  access-token-valid-time: 36000000
  refresh-token-valid-time: 1209600000

portone:
  webhook-secret: local-webhook-secret

agora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  scheduler:
    nego-expiration:
      fixed-delay: 300000
      initial-delay: 300000

---

spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/config/agora/
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}
  cloud:
    aws:
      region:
        static: ap-northeast-2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-valid-time: 3600000
  refresh-token-valid-time: 1209600000

portone:
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

agora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  scheduler:
    nego-expiration:
      fixed-delay: ${NEGO_EXPIRATION_FIXED_DELAY:300000}
      initial-delay: ${NEGO_EXPIRATION_INITIAL_DELAY:300000}

---

spring:
  config:
    activate:
      on-profile: docker
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-valid-time: 3600000
  refresh-token-valid-time: 1209600000

portone:
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

agora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  scheduler:
    nego-expiration:
      fixed-delay: ${NEGO_EXPIRATION_FIXED_DELAY:300000}
      initial-delay: ${NEGO_EXPIRATION_INITIAL_DELAY:300000}
