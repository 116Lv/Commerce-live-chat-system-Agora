spring:
  application:
    name: agora
  profiles:
    active: local

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:agora_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true # Hibernate가 테이블을 다 만든 후에 data.sql을 실행하도록 지연시킴

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

jwt:
  secret-key: localEnvDummySecretKeyForAgoraProjectTest12345!
  access-token-valid-time: 36000000

---

spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/config/agora/
  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url, username, password는 aws-parameterstore를 통해 로드되도록 설정

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # [초기화 스크립트 실행 방지]
  sql:
    init:
      mode: never

  # [H2 콘솔 끄기]
  h2:
    console:
      enabled: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-valid-time: 3600000