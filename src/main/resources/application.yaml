spring:
  application:
    name: agora
  profiles:
    active: local

---

spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:h2:mem:agora_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true # Hibernate가 테이블을 다 만든 후에 data.sql을 실행하도록 지연시킴

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

jwt:
  secret-key: localEnvDummySecretKeyForAgoraProjectTest12345!
  access-token-valid-time: 36000000
  refresh-token-valid-time: 1209600000

portone:
  webhook-secret: local-webhook-secret

agora:
  scheduler:
    nego-expiration:
      fixed-delay: 300000
      initial-delay: 300000

---

spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/config/agora/
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}
  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url, username, password는 aws-parameterstore를 통해 로드되도록 설정

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # [초기화 스크립트 실행 방지]
  sql:
    init:
      mode: never

  # [H2 콘솔 끄기]
  h2:
    console:
      enabled: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-valid-time: 3600000
  refresh-token-valid-time: 1209600000

portone:
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

agora:
  scheduler:
    nego-expiration:
      fixed-delay: ${NEGO_EXPIRATION_FIXED_DELAY:300000}
      initial-delay: ${NEGO_EXPIRATION_INITIAL_DELAY:300000}
